<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dziennik treningowy</title>
<meta name="theme-color" content="#1B2230">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trening">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#E8EBEF; --surface:#F7F8FA; --ink:#1B2230; --muted:#5A6475; --line:#C9CFD8; --field:#EEF0F3;
  --red:#C8102E; --blue:#1F4FB5; --yellow:#C98E00; --green:#2E7D4F;
  --body:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --cond:"SF Pro Display", -apple-system, "Arial Narrow", "Roboto Condensed", sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141B; --surface:#1B212C; --ink:#E6E9EE; --muted:#9AA4B4; --line:#313A48; --field:#232A36;
    --red:#E5566A; --blue:#6A93EA; --yellow:#E8B530; --green:#55B47D;
  }
}
:root[data-theme="dark"]{
  --bg:#10141B; --surface:#1B212C; --ink:#E6E9EE; --muted:#9AA4B4; --line:#313A48; --field:#232A36;
  --red:#E5566A; --blue:#6A93EA; --yellow:#E8B530; --green:#55B47D;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 150px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px}
h1{font-family:var(--cond);font-weight:800;font-size:1.6rem;line-height:1;margin:0;letter-spacing:-.01em}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.tabs button{font:inherit;font-weight:600;font-size:.9rem;border:0;background:transparent;color:var(--muted);padding:8px 11px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button{touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.controls{display:grid;gap:10px;margin-bottom:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lbl{font-size:.82rem;color:var(--muted);min-width:56px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.stepper button{font:inherit;font-size:1.15rem;border:0;background:none;color:var(--ink);width:40px;height:36px;cursor:pointer}
.stepper span{font-weight:700;min-width:26px;text-align:center}
.weeks{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;flex:1;min-width:0}
.weeks button{font:inherit;font-weight:700;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;position:relative;padding:0}
.weeks button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.weeks button.done::after{content:"";position:absolute;right:4px;top:4px;width:6px;height:6px;border-radius:50%;background:var(--green)}
.weeks button.deload{color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.days button{font:inherit;text-align:left;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:8px;background:var(--surface);color:var(--ink);padding:7px 8px;cursor:pointer;min-width:0}
.days button b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.days button small{color:var(--muted);font-size:.74rem}
.days button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.days button[aria-pressed="true"] small{color:rgba(255,255,255,.88)}

.session-head{display:flex;align-items:center;gap:12px;margin:6px 0 10px}
.plate{width:40px;height:40px;border-radius:50%;background:var(--c);flex:none;box-shadow:inset 0 0 0 7px rgba(255,255,255,.18),inset 0 0 0 13px var(--c),inset 0 0 0 17px rgba(0,0,0,.2)}
.session-head h2{font-family:var(--cond);font-size:1.45rem;font-weight:800;line-height:1.05;margin:0}
.session-head p{margin:2px 0 0;color:var(--muted);font-size:.86rem}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;margin-bottom:10px}
.ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ex h3{margin:0;font-size:1rem;font-weight:650}
.target{font-weight:800;font-size:1.05rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:3px 0 8px;font-size:.8rem;color:var(--muted)}
.rest{display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.rest button{font:inherit;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:6px;width:26px;height:24px;cursor:pointer;padding:0}
.rest span{min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:18px minmax(0,1fr) 12px minmax(0,.8fr) 64px 46px;align-items:center;gap:6px}
.set-h span{font-size:.72rem;color:var(--muted);padding-left:3px;line-height:1}
.set-h{margin-bottom:-2px}
.setbtns{display:flex;gap:16px}
.addset.rm{color:var(--red)}
.addset:disabled{opacity:.35}
.set.norpe{grid-template-columns:18px minmax(0,1fr) 12px minmax(0,.8fr) 46px}
.set .n{font-size:.8rem;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.set .x{color:var(--muted);text-align:center;font-size:.85rem}
.set input,.set select{font:inherit;font-size:16px;width:100%;height:42px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.set select{width:64px;text-align:center}
.set input::placeholder{color:var(--muted);opacity:.7}
.tick{height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font-size:1.2rem;font-weight:800;cursor:pointer;padding:0}
.set.done .tick{background:var(--green);border-color:var(--green);color:#fff}
.set.done input,.set.done select{border-color:transparent}
.unit{font-size:.72rem;color:var(--muted)}
.ex-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.addset{font:inherit;font-size:.82rem;border:0;background:none;color:var(--blue);padding:4px 0;cursor:pointer}
.hint{margin:0;font-size:.84rem;text-align:right}
.hint.up{color:var(--green)} .hint.hold{color:var(--red)} .hint.ok{color:var(--muted)}
.skip{color:var(--muted);font-size:.9rem;margin:6px 0 0}
.note label{font-size:.84rem;color:var(--muted);display:block;margin:6px 0 4px}
.note textarea{width:100%;min-height:70px;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);resize:vertical}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:1.05rem;margin:0 0 2px}
.card .sum{margin:0 0 8px;color:var(--muted);font-size:.86rem}
.card .big{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
.delta.up{color:var(--green)} .delta.down{color:var(--red)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.empty{color:var(--muted);font-size:.9rem;margin:6px 0}
select.pick{font:inherit;font-size:16px;height:42px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);width:100%;margin-bottom:10px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--muted);font-size:.78rem}
tr:last-child td{border-bottom:0}

.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.opt:first-of-type{border-top:0}
.opt p{margin:2px 0 0;font-size:.8rem;color:var(--muted)}
.switch{width:52px;height:32px;border-radius:16px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{left:23px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* timer */
#timer{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);transform:translateY(110%);transition:transform .2s ease;z-index:10}
#timer.on{transform:none}
#timer.end{background:var(--green);color:#fff}
.t-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.t-name{font-size:.8rem;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-time{font-size:2.3rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.t-btns{display:flex;gap:6px;grid-row:1 / span 2;grid-column:2}
.t-btns button{font:inherit;font-weight:700;font-size:.9rem;height:44px;min-width:50px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:inherit;cursor:pointer}
.t-bar{grid-column:1 / -1;height:4px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:4px}
.t-bar i{display:block;height:100%;background:currentColor;width:0}
.edit-btn{padding:8px 12px;font-size:.88rem;flex:none}
.banner{background:var(--surface);border:1px solid var(--yellow);border-left:6px solid var(--yellow);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.banner p{margin:0;font-size:.9rem}
.banner .btns{margin-top:10px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.45}
.ed{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.eds .ed:first-of-type{border-top:0}
.ed-t{min-width:0}.ed-t b{display:block;font-weight:600}.ed-t small{color:var(--muted);font-size:.8rem}
.ed-b{display:flex;gap:6px;flex:none}
.ed-b button{font:inherit;font-weight:700;width:40px;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;padding:0}
.ed-b button[data-del]{color:var(--red)}
.ed-b button:disabled{opacity:.3}
.addform label{display:grid;gap:4px;font-size:.8rem;color:var(--muted);margin-bottom:10px}
.addform input,.addform select{font:inherit;font-size:16px;height:42px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);width:100%;min-width:0}
.grid3{display:grid;grid-template-columns:1fr 1.3fr 1.3fr;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
@media (prefers-reduced-motion:reduce){#timer,.switch::after{transition:none}}
@media (max-width:380px){.tabs button{padding:8px 8px;font-size:.84rem}h1{font-size:1.35rem}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Trening</h1>
    <nav class="tabs" id="tabs">
      <button data-tab="log">Dziennik</button>
      <button data-tab="charts">Wykresy</button>
      <button data-tab="settings">Ustawienia</button>
    </nav>
  </header>
  <main id="app"></main>
</div>
<div id="timer" role="timer" aria-live="off">
  <div class="t-in">
    <div class="t-name" id="tName"></div>
    <div class="t-btns">
      <button data-t="-15" aria-label="Skróć o 15 sekund">−15</button>
      <button data-t="15" aria-label="Wydłuż o 15 sekund">+15</button>
      <button data-t="skip" id="tSkip">Pomiń</button>
    </div>
    <div class="t-time" id="tTime">0:00</div>
    <div class="t-bar"><i id="tBar"></i></div>
  </div>
</div>

<script>
/* ================= PLAN ================= */
// fazy: [tyg1-2, tyg3-4, tyg5-6, tyg7, tyg8 test, tyg9 deload]; [serie, powt, RIR, (etykieta)]
const M=(id,name,rest,plan)=>({type:'M',id,name,rest,plan});
const A=(id,name,rest,sets,reps,note='')=>({type:'A',id,name,rest,sets,reps,note});
const DAYS=[
  {id:'sob',name:'Sobota', title:'Squat heavy + Technical DL + Bench', c:'var(--yellow)'},
  {id:'nd', name:'Niedziela',title:'Bench + Plecy', c:'var(--green)'},
  {id:'wt', name:'Wtorek', title:'Squat volume + Bench', c:'var(--red)'},
  {id:'czw',name:'Czwartek',title:'Deadlift + Bench (ciężki)', c:'var(--blue)'}
];
const NW=9;
const MX=[1,1,0,'MAX (test 1RM)'];
const PLAN={
  sob:[
    M('ss','Squat: single',240,[[1,1,3],[1,1,2],[1,1,1.5],[1,1,1],MX,null]),
    M('sb','Squat: back-off',210,[[4,4,3],[4,3,2.5],[3,3,2],[2,2,2],null,[3,3,4]]),
    M('tdl','Technical deadlift',120,[[6,2,6],[6,2,5.5],[6,2,5],[4,1,5],null,[4,2,6]]),
    M('pb','Paused bench',180,[[4,5,3],[4,4,2.5],[4,3,2],[2,3,2],null,[3,3,4]]),
    A('wp','Weighted plank',60,3,'45–60 s')
  ],
  nd:[
    M('bh','Competition bench',180,[[5,4,3],[5,4,2.5],[4,4,2],[3,3,2],[3,3,4],[3,3,4]]),
    M('sp','Spoto press',180,[[3,4,3],[3,4,2.5],[3,4,2],[2,3,2],null,null]),
    A('row','Wiosłowanie',120,3,'6–8'),
    A('pu','Podciąganie',120,3,'6–8'),
    A('fp','Face pulls',60,3,'15'),
    A('hlr','Leg raise',60,3,'10–15')
  ],
  wt:[
    M('sq','Competition squat',210,[[5,5,3],[5,4,2.5],[4,4,2],[3,3,1.5],null,[3,3,4]]),
    M('psq','Paused squat',180,[[3,4,3.5],[3,4,3],[3,3,2.5],[2,3,2.5],null,[2,3,4]]),
    M('bnv','Competition bench',150,[[4,8,3.5],[4,7,3],[4,6,2.5],[2,6,2],MX,[3,5,4]]),
    A('cgb','Close-grip bench',120,3,'8','RIR 3'),
    A('ohe','Wyprosty nad głową (linka/hantla)',90,3,'10–12','RIR 2'),
    A('aw','Ab wheel',60,3,'8–12')
  ],
  czw:[
    M('dl','Competition deadlift',210,[[4,5,3],[4,4,2.5],[3,4,2],[2,3,1.5],MX,[2,3,4]]),
    M('pdl','Paused deadlift',180,[[3,3,3.5],[3,3,3],[3,2,2.5],[2,2,2.5],null,null]),
    M('bs','Bench: single',240,[[1,1,2],[1,1,1.5],[1,1,1],[1,1,0.5],null,null]),
    M('bb','Bench: back-off',180,[[4,4,3],[4,3,2.5],[4,3,2],[2,2,2],[3,3,4],[3,3,4]]),
    A('dip','Dipsy / wyciskanie hantli',120,3,'8–10','RIR 3'),
    A('cc','Cable crunch',60,3,'12–15')
  ]
};
const BENCH_IDS=['bnv','bs','bb','pb','bh','sp'];
const GROUPS=[
  {name:'Bench',ids:[['nd','bh'],['wt','bnv'],['czw','bs'],['czw','bb']],c:'var(--blue)'},
  {name:'Squat',ids:[['sob','ss'],['sob','sb'],['wt','sq']],c:'var(--red)'},
  {name:'Deadlift',ids:[['czw','dl']],c:'var(--yellow)'}
];
const G=w=>w<=2?0:w<=4?1:w<=6?2:w===7?3:w===8?4:5;
const fmt=n=>String(n).replace('.',',');
const rirTxt=r=>r%1?`${Math.floor(r)}–${Math.ceil(r)}`:String(r);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayOf=id=>DAYS.find(d=>d.id===id);
const dayPlan=d=>(D.plan&&D.plan[d])||PLAN[d];
const exOf=(d,id)=>dayPlan(d).find(x=>x.id===id)||PLAN[d].find(x=>x.id===id)||(D.removed&&D.removed[d+':'+id]);
function ensurePlan(){if(!D.plan)D.plan=JSON.parse(JSON.stringify(PLAN))}
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const weekLabel=w=>w===7?'taper (mniej serii)':w===8?'test maksów':w===9?'deload':'';
const W8T={sob:'Test: squat',nd:'Lekki trening techniczny',wt:'Test: bench',czw:'Test: deadlift'};
const dayTitle=(d,w)=>w===8?W8T[d.id]:d.title;

function planFor(ex,w){
  const g=G(w);
  if(ex.type==='C'){
    const sets=g>=3?Math.ceil(ex.sets/2):ex.sets, r=parseInt(ex.reps,10);
    return {sets,reps:isNaN(r)?'':r,rir:ex.rir,text:`${sets}×${ex.reps}${ex.rir!=null?' RIR '+rirTxt(ex.rir):''}`,rirField:ex.rir!=null,sec:/s$/.test(ex.reps)};
  }
  if(ex.type==='M'){
    const t=ex.plan[g]; if(!t) return {skip:true};
    return {sets:t[0],reps:t[1],rir:t[2],text:t[3]||`${t[0]}×${t[1]} RIR ${rirTxt(t[2])}`,rirField:true};
  }
  const sets=g>=3?Math.ceil(ex.sets/2):ex.sets;
  return {sets,reps:parseInt(ex.reps,10),rir:null,text:`${sets}×${ex.reps}${ex.note?' '+ex.note:''}`,rirField:false,sec:/s$/.test(ex.reps)};
}
function e1rm(kg,reps,rir){
  if(!kg) return null;
  const tot=(reps||1)+(rir||0);
  return Math.round((tot<=1?kg:kg*(1+tot/30))*2)/2;
}

/* ================= STORAGE ================= */
const KEY='trening-v2';
let D={v:1,sessions:{},rest:{},plan:null,removed:{},ui:{block:1,week:1,day:'sob',tab:'log',pick:'nd:bh'},opts:{sound:true,wake:false,haptic:true,loud:false},timer:null};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&s.sessions){D={...D,...s,ui:{...D.ui,...s.ui},opts:{...D.opts,...s.opts}}}}catch(e){}
let saveErr=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));saveErr=false}catch(e){if(!saveErr){saveErr=true;alert('Nie udało się zapisać danych na urządzeniu. Zrób kopię w Ustawieniach.')}}}
const sid=(b,w,d)=>`b${b}-w${w}-${d}`;
function parseSid(id){const m=/^b(\d+)-w(\d+)-(\w+)$/.exec(id);return m?{b:+m[1],w:+m[2],d:m[3]}:null}
function sess(create){const id=sid(D.ui.block,D.ui.week,D.ui.day);if(!D.sessions[id]&&create)D.sessions[id]={sets:{},note:''};return D.sessions[id]}
const restFor=ex=>D.rest[ex.id]??ex.rest;

function prevSession(day,exId,b,w){
  let best=null;
  for(const id in D.sessions){
    const p=parseSid(id); if(!p||p.d!==day) continue;
    if(p.b>b||(p.b===b&&p.w>=w)) continue;
    const arr=(D.sessions[id].sets||{})[exId]; if(!arr||!arr.some(s=>s&&s.done)) continue;
    if(!best||p.b>best.b||(p.b===best.b&&p.w>best.w)) best={...p,arr};
  }
  return best;
}
function hintFor(ex,arr,w){
  if(ex.type!=='M'||!arr) return ['',''];
  const p=planFor(ex,w); if(p.skip||p.rir==null||p.rir===0) return ['',''];
  const done=arr.filter(s=>s&&s.done&&s.rir!=null); if(!done.length) return ['',''];
  const last=done[done.length-1], diff=last.rir-p.rir, inc=BENCH_IDS.includes(ex.id)?2.5:5;
  if(diff>=1) return ['up',`Lżej niż plan: za tydzień +${fmt(inc)} kg`];
  if(diff>=0.5) return ['up','Trochę lżej: możesz dołożyć 2,5 kg'];
  if(diff<=-1) return ['hold','Ciężej niż plan: nie dokładaj'];
  return ['ok','Zgodnie z planem'];
}

function doneCount(s){if(!s||!s.sets)return 0;return Object.values(s.sets).reduce((a,arr)=>a+arr.filter(x=>x&&x.done).length,0)}

function phKg(arr,i,prev){
  for(let j=i-1;j>=0;j--) if(arr[j]&&arr[j].kg!=null) return arr[j].kg;

/* ---------- charts ---------- */
function exPoints(day,exId){
  const out=[];
  for(const id in D.sessions){
    const p=parseSid(id); if(!p||p.d!==day) continue;
    const arr=(D.sessions[id].sets||{})[exId]; if(!arr) continue;
    const ex=exOf(day,exId), pl=planFor(ex,p.w); if(pl.skip) continue;
    let best=null,bs=null;
    arr.forEach(s=>{if(!s||!s.done||!s.kg) return; const v=e1rm(s.kg,s.reps||pl.reps,s.rir!=null?s.rir:pl.rir); if(v&&(!best||v>best)){best=v;bs=s}});
    if(best) out.push({b:p.b,w:p.w,e1:best,kg:bs.kg,reps:bs.reps||pl.reps,rir:bs.rir!=null?bs.rir:null});
  }
  return out.sort((a,b)=>a.b-b.b||a.w-b.w);
}
function groupPoints(g){
  const map={};
  g.ids.forEach(([d,id])=>exPoints(d,id).forEach(p=>{const k=p.b*100+p.w;if(!map[k]||p.e1>map[k].e1)map[k]={...p}}));
  return Object.values(map).sort((a,b)=>a.b-b.b||a.w-b.w);
}
function chartSVG(pts,color){
  const W=640,H=220,pl=46,pr=12,pt=16,pb=30;
  const vals=pts.map(p=>p.e1);let lo=Math.min(...vals),hi=Math.max(...vals);
  if(hi-lo<5){const m=(hi+lo)/2;lo=m-2.5;hi=m+2.5}
  lo=Math.floor(lo/2.5)*2.5;hi=Math.ceil(hi/2.5)*2.5;
  const x=i=>pl+(W-pl-pr)*(pts.length===1?0.5:i/(pts.length-1));
  const y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const mid=(lo+hi)/2;
  const grid=[hi,mid,lo].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="${v===mid?'3 4':''}"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${fmt(Math.round(v*2)/2)}</text>`).join('');
  const step=Math.ceil(pts.length/8);
  const xl=pts.map((p,i)=>(i%step===0||i===pts.length-1)?`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--muted)">B${p.b}T${p.w}</text>`:'').join('');
  const line=pts.map((p,i)=>`${x(i).toFixed(1)},${y(p.e1).toFixed(1)}`).join(' ');
  const area=`${x(0).toFixed(1)},${H-pb} ${line} ${x(pts.length-1).toFixed(1)},${H-pb}`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Szacowany 1RM w kolejnych tygodniach">
    ${grid}
    <polygon points="${area}" fill="${color}" opacity=".10"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.e1)}" r="5" fill="var(--surface)" stroke="${color}" stroke-width="2.5"><title>B${p.b} T${p.w}: ${fmt(p.e1)} kg</title></circle>`).join('')}
    ${xl}</svg>`;
}
function summary(pts){
  const last=pts[pts.length-1],first=pts[0],d=Math.round((last.e1-first.e1)*2)/2;
  const cls=d>0?'up':d<0?'down':'';
  return `<p class="sum"><span class="big">${fmt(last.e1)} kg</span> ${pts.length>1?`<span class="delta ${cls}">${d>0?'+':''}${fmt(d)} kg od B${first.b} T${first.w}</span>`:''}</p>`;
}
function renderCharts(){

const tEl=document.getElementById('timer'),tName=document.getElementById('tName'),tTime=document.getElementById('tTime'),tBar=document.getElementById('tBar'),tSkip=document.getElementById('tSkip');
/* ---- dźwięk i wibracja ---- */
function makeWav(){
  const sr=22050,dur=1.0,n=Math.floor(sr*dur),buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  const w=(o,str)=>{for(let i=0;i<str.length;i++)v.setUint8(o+i,str.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  const beeps=[[0,880],[0.3,880],[0.6,1175]];
  for(let i=0;i<n;i++){const t=i/sr;let x=0;
    for(const [st,f] of beeps){const dt=t-st;if(dt>=0&&dt<0.22){const env=Math.min(1,dt/0.01)*Math.min(1,(0.22-dt)/0.05);x+=Math.sin(2*Math.PI*f*dt)*env}}
    v.setInt16(44+i*2,Math.max(-1,Math.min(1,x*0.8))*32767,true)}
  let bin='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=8192)bin+=String.fromCharCode.apply(null,u.subarray(i,i+8192));
  return 'data:audio/wav;base64,'+btoa(bin);
}
const beepEl=new Audio(makeWav());beepEl.preload='auto';
let audioPrimed=false,actx=null;
function setAudioSession(){try{if(navigator.audioSession)navigator.audioSession.type=D.opts.loud?'playback':'transient'}catch(e){}}
function unlockAudio(){
  setAudioSession();
  if(!audioPrimed){audioPrimed=true;try{beepEl.muted=true;const p=beepEl.play();if(p&&p.then)p.then(()=>{beepEl.pause();beepEl.currentTime=0;beepEl.muted=false}).catch(()=>{beepEl.muted=false;audioPrimed=false});else{beepEl.pause();beepEl.muted=false}}catch(e){beepEl.muted=false;audioPrimed=false}}
  try{if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C()}if(actx&&actx.state!=='running')actx.resume()}catch(e){}
}
function beepWebAudio(){
  if(!actx)return;try{if(actx.state!=='running')actx.resume()}catch(e){}
  const t0=actx.currentTime+0.02;
  [0,0.3,0.6].forEach((d,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=i===2?1175:880;
    g.gain.setValueAtTime(0.0001,t0+d);g.gain.exponentialRampToValueAtTime(0.6,t0+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+d+0.22);
    o.connect(g).connect(actx.destination);o.start(t0+d);o.stop(t0+d+0.25)});
}
function beep(){
  setAudioSession();
  try{beepEl.muted=false;beepEl.currentTime=0;const p=beepEl.play();if(p&&p.catch)p.catch(beepWebAudio)}catch(e){beepWebAudio()}
}
const hapt=document.createElement('label');hapt.setAttribute('aria-hidden','true');
hapt.style.cssText='position:fixed;left:-9999px;top:0;opacity:0;pointer-events:none';
hapt.innerHTML='<input type="checkbox" switch tabindex="-1">';document.body.appendChild(hapt);
function haptic(times=1){if(!D.opts.haptic)return;for(let i=0;i<times;i++)setTimeout(()=>{try{hapt.click()}catch(e){}},i*180)}
function startTimer(ex){D.timer={end:Date.now()+restFor(ex)*1000,total:restFor(ex),name:ex.name,alerted:false};save();drawTimer()}
function stopTimer(){D.timer=null;save();drawTimer()}
function drawTimer(){
  const t=D.timer;
  if(!t){tEl.classList.remove('on','end');return}
  const left=(t.end-Date.now())/1000;
  tEl.classList.add('on');
  if(left>0){
    tEl.classList.remove('end');tName.textContent='Przerwa po: '+t.name;tTime.textContent=mmss(Math.ceil(left));
    tBar.style.width=(100*(1-left/t.total)).toFixed(1)+'%';tSkip.textContent='Pomiń';
  }else{
    tEl.classList.add('end');tName.textContent=t.name;tTime.textContent='Koniec przerwy';tBar.style.width='100%';tSkip.textContent='OK';
    if(!t.alerted){t.alerted=true;save();if(document.visibilityState==='visible'&&left>-5){if(D.opts.sound)beep();haptic(3)}}
    if(left<-60) stopTimer();
  }
}

tEl.addEventListener('click',ev=>{
  const b=ev.target.closest('button[data-t]');if(!b||!D.timer)return;
  if(b.dataset.t==='skip'){stopTimer();return}
  const dlt=+b.dataset.t;D.timer.end+=dlt*1000;D.timer.total=Math.max(15,D.timer.total+dlt);D.timer.alerted=false;save();drawTimer();
});

/* wake lock */
let wl=null;
async function applyWake(){
  try{
    if(D.opts.wake&&'wakeLock' in navigator&&document.visibilityState==='visible'){if(!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}
    else if(wl){await wl.release();wl=null}
  }catch(e){wl=null}
}
document.addEventListener('visibilitychange',()=>{applyWake();drawTimer()});

/* ================= EVENTS ================= */
document.getElementById('tabs').addEventListener('click',ev=>{const b=ev.target.closest('button[data-tab]');if(!b)return;D.ui.tab=b.dataset.tab;save();render();window.scrollTo(0,0)});

app.addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  const u=D.ui;
  if(b.dataset.week){u.week=+b.dataset.week;save();render();return}
  if(b.dataset.day){u.day=b.dataset.day;save();render();return}
  if(b.dataset.block){u.block=Math.max(1,u.block+ +b.dataset.block);save();render();return}
  if(b.dataset.opt){const k=b.dataset.opt;D.opts[k]=!D.opts[k];b.setAttribute('aria-checked',String(D.opts[k]));save();if(k==='wake')applyWake();if(k==='sound'||k==='loud'){unlockAudio()}if(k==='haptic'&&D.opts.haptic)haptic();return}
  if(b.hasAttribute('data-beep')){unlockAudio();beep();haptic(3);return}
  if(b.hasAttribute('data-export')){exportData();return}
  if(b.hasAttribute('data-snooze')){D.snoozeBackup=Date.now()+DAY_MS;save();render();return}
  if(b.hasAttribute('data-import')){document.getElementById('importFile').click();return}
  if(b.hasAttribute('data-resetplan')){if(!confirm('Przywrócić domyślny plan? Twoje zmiany w ćwiczeniach zostaną usunięte, wyniki zostają.'))return;D.plan=null;u.edit=false;save();render();return}
  if(b.hasAttribute('data-edit')){u.edit=!u.edit;save();render();return}
  const edEl=b.closest('[data-ed]');
  if(edEl){
    ensurePlan();const list=D.plan[u.day],i=list.findIndex(x=>x.id===edEl.dataset.ed);if(i<0)return;
    if(b.dataset.mv){const j=i+ +b.dataset.mv;if(j<0||j>=list.length)return;[list[i],list[j]]=[list[j],list[i]];save();render();return}
    if(b.hasAttribute('data-del')){const ex=list[i];if(!confirm(`Usunąć „${ex.name}” z planu? Zapisane wyniki zostaną w historii.`))return;
      if(ex.type==='C'){D.removed=D.removed||{};D.removed[u.day+':'+ex.id]=ex}list.splice(i,1);save();render();return}
    return;
  }
  if(b.hasAttribute('data-addex')){
    const name=document.getElementById('nName').value.trim();if(!name){alert('Wpisz nazwę ćwiczenia.');document.getElementById('nName').focus();return}
    const sets=Math.max(1,parseInt(document.getElementById('nSets').value,10)||3);
    const reps=document.getElementById('nReps').value.trim()||'8';
    const rv=document.getElementById('nRir').value;
    const rest=Math.max(15,parseInt(document.getElementById('nRest').value,10)||120);
    const pos=document.getElementById('nPos').value;
    ensurePlan();const ex={type:'C',id:'c'+Date.now().toString(36),name,rest,sets,reps,rir:rv===''?null:+rv};
    const list=D.plan[u.day];if(pos==='end')list.push(ex);else list.splice(+pos,0,ex);save();render();return;
  }
  const exEl=b.closest('[data-ex]'); if(!exEl) return;
  const ex=exOf(u.day,exEl.dataset.ex);
  if(b.dataset.rest){D.rest[ex.id]=Math.max(15,restFor(ex)+ +b.dataset.rest);save();exEl.querySelector('.rest span').textContent=mmss(restFor(ex));return}
  if(b.hasAttribute('data-add')){const s=sess(true);const p=planFor(ex,u.week);const cur=setCount(ex,s,p);s.count=s.count||{};s.count[ex.id]=cur+1;save();rerenderEx(exEl,ex);return}
  if(b.hasAttribute('data-rm')){
    const s=sess(true);const p=planFor(ex,u.week);const cur=setCount(ex,s,p);if(cur<=0)return;
    const arr=s.sets[ex.id]||[];const last=arr[cur-1];
    if(last&&(last.done||last.kg!=null)&&!confirm(`Usunąć serię ${cur} z wpisanym wynikiem?`))return;
    if(arr.length>cur-1)arr.length=cur-1;
    s.count=s.count||{};s.count[ex.id]=cur-1;save();rerenderEx(exEl,ex);updateDayBadge();return}
  if(b.hasAttribute('data-tick')){
    unlockAudio();
    const row=b.closest('.set'),i=+row.dataset.i,s=sess(true),arr=s.sets[ex.id]||(s.sets[ex.id]=[]);
    const st=arr[i]||(arr[i]={});
    st.done=!st.done;
    if(st.done){
      const kgIn=row.querySelector('[data-f=kg]'),rIn=row.querySelector('[data-f=reps]');
      if(st.kg==null&&kgIn.placeholder!=='kg'){st.kg=+kgIn.placeholder.replace(',','.');kgIn.value=st.kg}
      if(st.reps==null){const pr=parseInt(rIn.placeholder,10);if(!isNaN(pr)){st.reps=pr;rIn.value=pr}}
      startTimer(ex);haptic();
    }
    for(let j=0;j<arr.length;j++) if(arr[j]===undefined) arr[j]=null;
    row.classList.toggle('done',!!st.done);b.setAttribute('aria-pressed',String(!!st.done));
    save();updateHint(exEl,ex);updateDayBadge();
  }
});
app.addEventListener('input',ev=>{
  const el=ev.target;
  if(el.id==='pick'){D.ui.pick=el.value;save();renderCharts();return}
  if(el.id==='note'){sess(true).note=el.value;save();return}
  const f=el.dataset.f;if(!f) return;
  const exEl=el.closest('[data-ex]'),row=el.closest('.set');if(!exEl||!row)return;
  const ex=exOf(D.ui.day,exEl.dataset.ex),i=+row.dataset.i,s=sess(true),arr=s.sets[ex.id]||(s.sets[ex.id]=[]);
  for(let j=0;j<i;j++) if(arr[j]===undefined) arr[j]=null;
  const st=arr[i]||(arr[i]={});
  const v=String(el.value).replace(',','.');
  if(v==='') delete st[f]; else st[f]=f==='reps'?parseInt(v,10):+v;
  save();
  if(f==='kg'){ // update placeholders of following sets
    exEl.querySelectorAll('.set').forEach(r=>{const j=+r.dataset.i;if(j<=i)return;const inp=r.querySelector('[data-f=kg]');const ph=phKg(arr,j,prevSession(D.ui.day,ex.id,D.ui.block,D.ui.week));inp.placeholder=ph===''?'kg':fmt(ph)});
  }
  if(f==='rir') updateHint(exEl,ex);
});
function rerenderEx(exEl,ex){const tmp=document.createElement('div');tmp.innerHTML=exHTML(ex,sess(false));exEl.replaceWith(tmp.firstElementChild)}
function updateHint(exEl,ex){const s=sess(false);const [hc,ht]=hintFor(ex,s&&s.sets[ex.id],D.ui.week);const h=exEl.querySelector('.hint');h.className='hint '+hc;h.textContent=ht}
function updateDayBadge(){
  const u=D.ui;document.querySelectorAll('.days button').forEach(b=>{const n=doneCount(D.sessions[sid(u.block,u.week,b.dataset.day)]);b.querySelector('small').textContent=n?n+' serii':'—'});
  document.querySelectorAll('.weeks button').forEach(b=>{const w=+b.dataset.week;b.classList.toggle('done',DAYS.some(d=>doneCount(D.sessions[sid(u.block,w,d.id)])>0))});
}

/* backup */
async function exportData(){
  const name='trening-kopia-'+new Date().toISOString().slice(0,10)+'.json';
  const json=JSON.stringify({...D,timer:null},null,1);
  try{
    const file=new File([json],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Kopia dziennika'});markBackup();return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);markBackup();
}
function markBackup(){D.lastBackup=Date.now();D.snoozeBackup=0;save();render()}
document.addEventListener('change',ev=>{
  if(ev.target.id!=='importFile')return;
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!d.sessions)throw 0;
      if(!confirm('Wczytać kopię? Obecne dane na tym urządzeniu zostaną zastąpione.'))return;
      D={...D,...d,ui:{...D.ui,...d.ui,tab:'log'},opts:{...D.opts,...d.opts},timer:null,lastBackup:Date.now(),snoozeBackup:0};save();render();alert('Kopia wczytana.');
    }catch(e){alert('Ten plik nie jest kopią dziennika.')}};
  r.readAsText(f);ev.target.value='';
});

/* offline */
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}

render();drawTimer();applyWake();
</script>
